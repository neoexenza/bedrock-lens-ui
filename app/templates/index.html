<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>bedrock-lens UI</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="/static/css/main.css"/>
</head>
<body>
<header>
  <h1>🔭 bedrock-lens</h1>
  <span id="updated">–</span>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab('live')">Live</button>
  <button class="tab" onclick="switchTab('history')">History</button>
</div>

<!-- LIVE TAB -->
<div id="tab-live">
  <div class="controls">
    <select id="region" onchange="restartLive()">
      <option value="eu-central-1" selected>eu-central-1</option>
      <option value="us-east-1">us-east-1</option>
      <option value="us-west-2">us-west-2</option>
      <option value="ap-southeast-1">ap-southeast-1</option>
    </select>

    <input id="threshold" type="number" step="0.01" placeholder="Alert $" oninput="checkThreshold()"/>

    <span class="live-indicator">● Live</span>
  </div>

  <div class="summary-bar">
    <div class="summary-card">
      <span class="label">Total cost</span>
      <span class="value" id="total-cost">–</span>
    </div>
    <div class="summary-card">
      <span class="label">Total calls</span>
      <span class="value" id="total-calls">–</span>
    </div>
    <div id="alert-banner" class="alert hidden">⚠️ Spend threshold crossed!</div>
  </div>

  <div class="layout">
    <div class="table-wrap">
      <table id="usage-table">
        <thead>
          <tr>
            <th>Model</th><th>Calls</th><th>Input tokens</th>
            <th>Output tokens</th><th>Total tokens</th><th>Cost</th>
          </tr>
        </thead>
        <tbody id="usage-body">
          <tr><td colspan="6" class="empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>
    <div class="chart-wrap">
      <canvas id="cost-chart"></canvas>
    </div>
  </div>
</div>

<!-- HISTORY TAB -->
<div id="tab-history" style="display:none">
  <div class="controls">
    <select id="hist-days" onchange="loadHistory()">
      <option value="7">Last 7 days</option>
      <option value="30" selected>Last 30 days</option>
      <option value="90">Last 90 days</option>
    </select>
    <select id="hist-region" onchange="loadHistory()">
      <option value="" selected>All regions</option>
      <option value="eu-central-1">eu-central-1</option>
      <option value="us-east-1">us-east-1</option>
      <option value="us-west-2">us-west-2</option>
      <option value="ap-southeast-1">ap-southeast-1</option>
    </select>
  </div>

  <div class="summary-bar">
    <div class="summary-card">
      <span class="label">Period cost</span>
      <span class="value" id="hist-total-cost">–</span>
    </div>
    <div class="summary-card">
      <span class="label">Period calls</span>
      <span class="value" id="hist-total-calls">–</span>
    </div>
  </div>

  <div class="layout">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Model</th><th>Calls</th><th>Input tokens</th>
            <th>Output tokens</th><th>Total tokens</th><th>Cost</th>
          </tr>
        </thead>
        <tbody id="hist-body">
          <tr><td colspan="6" class="empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>
    <div class="chart-wrap">
      <canvas id="hist-chart"></canvas>
    </div>
  </div>

  <div class="daily-table-wrap table-wrap" style="margin-top:1.2rem">
    <table>
      <thead><tr><th>Day</th><th>Calls</th><th>Cost</th></tr></thead>
      <tbody id="daily-body">
        <tr><td colspan="3" class="empty">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script src="/static/js/main.js"></script>
</body>
</html>
